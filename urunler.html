.nav-cta{background:var(--gold);color:var(--navy);font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:4px;font-family:'Montserrat',sans-serif;}

.breadcrumb{background:var(--gray);padding:12px 40px;font-size:12px;color:var(--muted);}
.breadcrumb a{color:var(--navy);font-weight:600;}

.page-hero{background:linear-gradient(120deg,var(--navy),#1A3A7A,#2453A8);padding:60px 40px;text-align:center;color:var(--white);}
.page-hero h1{font-family:'Montserrat',sans-serif;font-size:36px;font-weight:800;margin-bottom:10px;}
.page-hero p{color:rgba(255,255,255,.75);font-size:14px;}

.filters{padding:30px 40px;text-align:center;background:var(--white);border-bottom:1px solid var(--border);}
.filter-btn{font-size:12px;font-weight:600;padding:8px 18px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;margin:0 4px;font-family:inherit;}
.filter-btn:hover,.filter-btn.active{background:var(--navy);color:var(--white);border-color:var(--navy);}
#filterStatus{display:none;text-align:center;background:var(--gold);color:var(--navy);padding:12px 20px;border-radius:6px;font-size:13px;font-weight:600;max-width:600px;margin:14px auto 0;}

.products-wrapper{max-width:1200px;margin:0 auto;padding:50px 40px;}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.prod-card{background:var(--white);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;transition:all .2s;display:block;}
.prod-card:hover{box-shadow:0 8px 24px rgba(11,31,75,.1);transform:translateY(-4px);}
.prod-img{aspect-ratio:1;background:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;border-bottom:1px solid var(--border);position:relative;}
.prod-badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;}
.badge{padding:4px 10px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:'Montserrat',sans-serif;}
.badge-gold{background:var(--gold);color:var(--navy);}

.prod-body{padding:18px;}
.prod-cat{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;font-family:'Montserrat',sans-serif;}

<script>
let allProducts = [];
let currentFilter = 'all';

async function loadProducts() {
  const container = document.getElementById('products-container');
  const cacheBuster = '?t=' + Date.now();
  
  try {
    let productIds = [];
    
    // 1. Yerel index dosyasını oku (Hızlı & Limitsiz)
    try {
      const idxRes = await fetch('_data/urunler-index.json' + cacheBuster);
      if (idxRes.ok) productIds = await idxRes.json();
    } catch(e) {}

    // 2. Raw GitHub fallback (Limitsiz CDN)
    if (!productIds || productIds.length === 0) {
      try {
        const rawRes = await fetch('https://raw.githubusercontent.com/emrecanaksoy/global-mobilya/main/_data/urunler-index.json' + cacheBuster);
        if (rawRes.ok) productIds = await rawRes.json();
      } catch(e) {}
    }

    // 3. Fallback: GitHub API
    if (!productIds || productIds.length === 0) {
      try {
        const ghRes = await fetch('https://api.github.com/repos/emrecanaksoy/global-mobilya/contents/_data/urunler' + cacheBuster);
        if (ghRes.ok) {
          const files = await ghRes.json();
          productIds = files.filter(f => f.name.endsWith('.json')).map(f => f.name.replace('.json', ''));
        }
      } catch(e) {}
    }

    let loaded = [];
    if (productIds && productIds.length > 0) {
      const promises = productIds.map(async (id) => {
        try {
          // Önce yerel, sonra Raw GitHub
          let res = await fetch(`_data/urunler/${id}.json${cacheBuster}`);
          if (!res.ok) {
            res = await fetch(`https://raw.githubusercontent.com/emrecanaksoy/global-mobilya/main/_data/urunler/${id}.json${cacheBuster}`);
          }
          if (res.ok) {
            const data = await res.json();
            data.id = id;
            return data;
          }
        } catch(e) { return null; }
      });
      loaded = (await Promise.all(promises)).filter(p => p);
    }
    
    allProducts = loaded;
    
    if (allProducts.length === 0) {
      container.innerHTML = `<div class="empty"><h3>Henüz ürün eklenmedi</h3><p>Yakında ürünlerimiz burada listelenecek.</p></div>`;
      return;
    }
    
    renderProducts(allProducts);
    
  } catch (err) {
    container.innerHTML = `<div class="empty"><h3>⚠️ Yükleme Hatası</h3><p>Ürünler yüklenemedi. Lütfen sayfayı yenileyin.</p></div>`;
  }
}

function renderProducts(products) {
  const container = document.getElementById('products-container');
  
  if (products.length === 0) {
    container.innerHTML = `<div class="empty"><h3>Bu kategoride ürün bulunamadı</h3></div>`;
    return;
  }
  
  const html = `<div class="products-grid">${products.map(p => `
    <a href="urun.html?id=${p.id}" class="prod-card">
      <div class="prod-img" style="background-image:url('${p.ana_resim || 'resim/logo.png'}');">
        ${p.populer || p.yeni ? `<div class="prod-badges">
          ${p.populer ? '<span class="badge badge-gold">Popüler</span>' : ''}
          ${p.yeni ? '<span class="badge badge-new">Yeni</span>' : ''}
        </div>` : ''}
      </div>
      <div class="prod-body">
        <div class="prod-cat">${p.kategori || ''}</div>
        <h3>${p.title}</h3>
        <p>${p.kisa_aciklama || ''}</p>
        <div class="prod-detail">İncele →</div>
      </div>
    </a>
  `).join('')}</div>`;
  
  container.innerHTML = html;
}

function filterProducts(category, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  currentFilter = category;
  const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.kategori === category);
  
  const status = document.getElementById('filterStatus');
  if (category === 'all') {
    status.style.display = 'none';
  } else {
    status.style.display = 'block';
    status.innerHTML = `📁 "<strong>${category}</strong>" kategorisinde <strong>${filtered.length}</strong> ürün bulundu`;
  }
  
  renderProducts(filtered);
}

loadProducts();
</script>
