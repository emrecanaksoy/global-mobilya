<!DOCTYPE html>
<html lang="tr" data-page="blog">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Global Kapak Mobilya blog - Membran kapak, mobilya bakımı ve dekorasyon yazıları">
<title>Blog | Global Kapak Mobilya</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--navy:#0B1F4B;--gold:#C8A96E;--white:#fff;--gray:#f7f7f7;--border:#e5e5e5;--text:#333;--muted:#777;}
body{font-family:'Open Sans',sans-serif;color:var(--text);}
a{text-decoration:none;color:inherit;}
img{max-width:100%;height:auto;display:block;}

nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:65px;position:sticky;top:0;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.nav-logo img{height:48px;}
.nav-menu{display:flex;flex:1;justify-content:center;}
.nav-menu a{font-size:11.5px;font-weight:600;color:var(--navy);padding:6px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;}
.nav-menu a:hover,.nav-menu a.active{background:var(--navy) !important;color:#fff !important;}
.nav-cta{background:var(--gold);color:var(--navy);font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:4px;font-family:'Montserrat',sans-serif;}
.hamburger{display:none;background:none;border:none;font-size:24px;cursor:pointer;}

.breadcrumb{background:var(--gray);padding:12px 40px;font-size:12px;color:var(--muted);}
.breadcrumb a{color:var(--navy);font-weight:600;}
.breadcrumb span{margin:0 6px;color:var(--border);}

.page-hero{background:linear-gradient(120deg,var(--navy),#1A3A7A,#2453A8);padding:50px 40px;text-align:center;color:var(--white);}
.page-hero h1{font-family:'Montserrat',sans-serif;font-size:34px;font-weight:800;margin-bottom:10px;}
.page-hero p{color:rgba(255,255,255,.7);font-size:14px;}

.blog-wrapper{max-width:1100px;margin:0 auto;padding:50px 40px;}
.blog-list{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.blog-card{background:var(--white);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;transition:all .2s;display:block;}
.blog-card:hover{box-shadow:0 6px 24px rgba(11,31,75,.1);transform:translateY(-3px);}
.blog-img{aspect-ratio:16/9;background:#f5f8fc;background-size:cover;background-position:center;border-bottom:1px solid var(--border);}
.blog-body{padding:18px;}
.blog-cat{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;font-family:'Montserrat',sans-serif;}
.blog-body h3{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:var(--navy);line-height:1.4;margin-bottom:8px;}
.blog-body p{font-size:12px;color:var(--muted);line-height:1.7;}
.blog-meta{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);font-weight:600;}

.empty{text-align:center;padding:60px 40px;color:var(--muted);}
.empty h3{color:var(--navy);font-size:20px;margin-bottom:10px;}
.loading{text-align:center;padding:60px 40px;color:var(--muted);}

footer{background:#060E22;padding:40px;color:rgba(255,255,255,.5);text-align:center;font-size:13px;}
footer a{color:var(--gold);}

@media(max-width:1024px){.blog-list{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){nav{padding:0 16px;}.nav-menu{display:none;position:absolute;top:65px;left:0;right:0;background:var(--white);flex-direction:column;padding:14px;}.nav-menu.open{display:flex;}.hamburger{display:block;}.nav-cta{display:none;}.blog-list{grid-template-columns:1fr;}.blog-wrapper{padding:30px 20px;}}

/* NAVBAR AKTİF/HOVER KESİN DÜZELTMESİ */
.nav-menu a:hover,
.nav-menu a.active {
  background: var(--navy) !important;
  color: #ffffff !important;
}
.nav-menu a {
  transition: background .2s, color .2s;
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="resim/logo.png" alt="Global Kapak Mobilya">
  </a>
  <div class="nav-menu" id="nm">
    <a href="index.html">Anasayfa</a>
    <a href="tedarikcilerimiz.html">Tedarikçilerimiz</a>
    <a href="urunler.html">Ürünlerimiz</a>
    <a href="hakkimizda.html">Hakkımızda</a>
    <a href="galeri.html">Galeri</a>
    <a href="blog.html" class="active">Blog</a>
    <a href="iletisim.html">İletişim</a>
  </div>
  <a href="iletisim.html" class="nav-cta">Teklif Al</a>
  <button class="hamburger" onclick="document.getElementById('nm').classList.toggle('open')">☰</button>
</nav>

<div class="breadcrumb">
  <a href="index.html">Anasayfa</a><span>›</span>
  <strong style="color:var(--navy);">Blog</strong>
</div>

<div class="page-hero">
  <h1>Blog & Makaleler</h1>
  <p>Membran kapak ve mobilya bakımı hakkında faydalı içerikler</p>
</div>

<div class="blog-wrapper">
  <div id="blog-container">
    <div class="loading">⏳ Yazılar yükleniyor...</div>
  </div>
</div>



<script>
async function loadBlogs() {
  const container = document.getElementById('blog-container');
  
  try {
    // GitHub API ile blog dosyalarını otomatik getir
    let blogIds = [];
    try {
      const ghRes = await fetch('https://api.github.com/repos/emrecanaksoyea34-a11y/global-kapak-mobilyaa/contents/_data/blog');
      if (ghRes.ok) {
        const files = await ghRes.json();
        blogIds = files
          .filter(f => f.name.endsWith('.json'))
          .map(f => f.name.replace('.json', ''));
      }
    } catch(e) {}
    
    if (blogIds.length === 0) {
      try {
        const indexResponse = await fetch('_data/blog-index.json');
        if (indexResponse.ok) blogIds = await indexResponse.json();
      } catch(e) {}
    }
    
    const blogPromises = blogIds.map(async (id) => {
      try {
        const r = await fetch(`_data/blog/${id}.json`);
        if (r.ok) {
          const data = await r.json();
          data.id = id;
          return data;
        }
      } catch(e) { return null; }
    });
    
    let posts = (await Promise.all(blogPromises)).filter(p => p);
    
    // Tarihe göre sırala (yeniden eskiye)
    posts.sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
    
    if (posts.length === 0) {
      container.innerHTML = `<div class="empty"><h3>Henüz yazı yok</h3><p>Yakında blog yazılarımız burada listelenecek.</p></div>`;
      return;
    }
    
    const html = `<div class="blog-list">${posts.map(p => {
      const tarih = p.tarih ? new Date(p.tarih).toLocaleDateString('tr-TR', {year:'numeric',month:'short',day:'numeric'}) : '';
      return `
        <a href="blog-yazi.html?id=${p.id}" class="blog-card">
          <div class="blog-img" style="background-image:url('${p.kapak_resim || 'resim/logo.png'}');"></div>
          <div class="blog-body">
            <div class="blog-cat">${p.kategori || ''}</div>
            <h3>${p.title}</h3>
            <p>${p.ozet || ''}</p>
            <div class="blog-meta"><span>📅 ${tarih}</span></div>
          </div>
        </a>
      `;
    }).join('')}</div>`;
    
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty"><h3>⚠️ Yükleme Hatası</h3></div>`;
  }
}

loadBlogs();
</script>

<script src="js/genel.js"></script>
<script src="js/tema.js"></script>
<script src="js/swipe.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
